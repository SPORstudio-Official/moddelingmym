<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>AE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="1280" height="720" tabindex="0"
            aria-label="AE screen"></canvas>

    <div id="overlay" class="hidden" role="alertdialog" aria-modal="true">
      <div class="panel">
        <h1 id="err-title">AE</h1>
        <pre id="err-body"></pre>
        <p class="hint" id="err-hint"></p>
        <button id="err-close" autofocus>Close</button>
      </div>
    </div>
  </div>

  <footer id="statusbar">
    <span class="brand">AE</span>
    <span id="status">starting&hellip;</span>
    <span class="spacer"></span>
    <span id="fps" class="dim"></span>
    <button id="fullscreen" title="Toggle fullscreen (F11)">&#9974;</button>
  </footer>

  <script src="aether-host.js"></script>
  <script src="boot.js"></script>
</body>
</html>
