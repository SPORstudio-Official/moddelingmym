name: Build Colony standalone Windows app

on:
  push:
    branches:
      - main
      - arena/1d248f79-moddelingmym
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build portable 64-bit Windows executable
        run: npm run dist:win
      - name: Publish standalone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: colony-latest
          name: Colony — Ant Colony Lab for Windows
          body: |
            Standalone portable Windows x64 desktop app. Download `Colony.exe` and run it; no browser, Python, or separate installation is required.

            The colony simulation is bundled locally and runs offline.
          files: release/Colony.exe
          overwrite_files: true
          make_latest: true
