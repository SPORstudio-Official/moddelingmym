name: Build DEAD AIR (Windows)

# Builds the standalone Windows executable on a runner (which, unlike the agent
# sandbox, has full internet access) and publishes it as a release asset.
#
# Optional voice re-record: commit .github/voice-request.txt containing
#   model=<openrouter model id>
#   voice=<voice id>
# and add the repository secret OPENROUTER_API_KEY. The job then re-records the
# tapes with tools/regen_voice_openrouter.py before building.

on:
  push:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/voice-request.txt'
      - '.github/workflows/deadair-build.yml'
  workflow_dispatch:
    inputs:
      openrouter_key:
        description: 'OpenRouter API key (leave blank to use the repository secret)'
        required: false
      model:
        description: 'TTS model id'
        required: false
        default: 'fish-audio/s2.1-pro-free:free'
      voice:
        description: 'voice id'
        required: false
        default: 'default'
      probe:
        description: '1 = run the voice-stability probe instead of re-recording'
        required: false
        default: ''
  repository_dispatch:
    types: [record-voice]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-record tapes (optional)
        id: voice
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          OR_API_KEY: ${{ secrets.OR_API_KEY }}
          OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          OPENROUTER: ${{ secrets.OPENROUTER }}
          OPENROUTERAPIKEY: ${{ secrets.OPENROUTERAPIKEY }}
          OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          SK_OR_KEY: ${{ secrets.SK_OR_KEY }}
          VAR_OPENROUTER_API_KEY: ${{ vars.OPENROUTER_API_KEY }}
          VAR_OPENROUTER_KEY: ${{ vars.OPENROUTER_KEY }}
          DISPATCH_KEY: ${{ github.event.client_payload.openrouter_key }}${{ github.event.inputs.openrouter_key }}
          DISPATCH_MODEL: ${{ github.event.client_payload.model }}${{ github.event.inputs.model }}
          DISPATCH_VOICE: ${{ github.event.client_payload.voice }}${{ github.event.inputs.voice }}
          DISPATCH_PROBE: ${{ github.event.client_payload.probe }}${{ github.event.inputs.probe }}
        run: |
          if [ ! -f .github/voice-request.txt ]; then
            echo "No .github/voice-request.txt - keeping the embedded tapes."
            echo "did=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KEYFOUND=""
          for v in DISPATCH_KEY OPENROUTER_API_KEY OPENROUTER_KEY OPENROUTER_TOKEN \
                   OR_API_KEY OPENROUTER_API FISH_API_KEY OPENROUTER OPENROUTERAPIKEY \
                   OPEN_ROUTER_KEY API_KEY SK_OR_KEY VAR_OPENROUTER_API_KEY VAR_OPENROUTER_KEY; do
            eval "val=\$$v"
            if [ -n "$val" ]; then KEYFOUND=1; break; fi
          done
          if [ -z "$KEYFOUND" ]; then
            echo "No API key in this run - keeping the embedded tapes (no status overwrite)."
            echo "did=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${DISPATCH_PROBE:-}" = "voices" ]; then
            python3 -m pip install --quiet numpy imageio-ffmpeg
            python3 tools/probe_voices.py
            echo "did=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${DISPATCH_PROBE:-}" = "1" ]; then
            python3 -m pip install --quiet numpy imageio-ffmpeg
            python3 tools/probe_voice.py
            echo "did=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MODEL=$(sed -n 's/^model=//p' .github/voice-request.txt | head -1)
          VOICE=$(sed -n 's/^voice=//p' .github/voice-request.txt | head -1)
          MODEL=${MODEL:-${DISPATCH_MODEL:-fish-audio/s2.1-pro-free:free}}
          VOICE=${VOICE:-${DISPATCH_VOICE:-default}}
          echo "Re-recording with model=$MODEL voice=$VOICE"
          python3 -m pip install --quiet numpy imageio-ffmpeg
          python3 -m pip install --quiet imageio-ffmpeg || sudo apt-get install -y -qq ffmpeg
          python3 tools/regen_voice_openrouter.py --model "$MODEL" --voice "$VOICE"
          echo "did=1" >> "$GITHUB_OUTPUT"

      - name: Commit re-recorded audio and diagnostics
        if: always() && steps.voice.outputs.did == '1'
        run: |
          git config user.name  "dead-air-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A assets/audio src/audio_data.h
          git add -A demo/probe_*.wav demo/voice_*.wav 2>/dev/null || true
          rm -f assets/audio/_voice_status.txt.tmp
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Voice job: audio + diagnostics (${{ steps.voice.outcome }})"
            git push
          fi

      - name: Install zig
        run: |
          python3 -m pip install --quiet ziglang
          ZIG=$(python3 -c "import ziglang, os; print(os.path.join(os.path.dirname(ziglang.__file__), 'zig'))")
          chmod +x "$ZIG"
          "$ZIG" version
          echo "ZIG=$ZIG" >> "$GITHUB_ENV"

      - name: Build DEAD_AIR.exe
        run: |
          ./scripts/build_windows.sh
          sha256sum build/DEAD_AIR.exe | tee build/DEAD_AIR.exe.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'EOF'
          **DEAD AIR** - a tactile / auditory psychological horror game.

          Windows 10/11 x64. Single standalone executable, no installer, no runtime.
          Unsigned, so SmartScreen may ask you to click *More info -> Run anyway*.
          Headphones strongly recommended: the game is entirely about what you hear.
          EOF
          )
          gh release view deadair >/dev/null 2>&1 || \
            gh release create deadair --title "DEAD AIR" --notes "$NOTES"
          # A plain .zip is also published: some AV download filters block a bare,
          # unsigned .exe served straight from a release URL but pass the same
          # bytes inside an archive.
          rm -f build/DEAD_AIR-portable.zip
          (cd build && zip -q -9 DEAD_AIR-portable.zip DEAD_AIR.exe DEAD_AIR.exe.sha256)
          # two runs can publish at once (push + dispatch); retry instead of failing
          ok=0
          for i in 1 2 3 4; do
            if gh release upload deadair build/DEAD_AIR.exe build/DEAD_AIR.exe.sha256 \
                 build/DEAD_AIR-portable.zip --clobber; then ok=1; break; fi
            echo "upload attempt $i failed; retrying in 10s"; sleep 10
          done
          [ "$ok" = "1" ] || { echo "release upload failed after 4 attempts"; exit 1; }
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/deadair/DEAD_AIR.exe"
